<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in - TripMind</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-box">
      <div class="auth-eyebrow">
        <p>Boarding pass to</p>
        <h1 class="display">TripMind</h1>
      </div>

      <div class="auth-card">
        <h2 class="display">Welcome back</h2>
        <p class="subtitle">Log in to keep planning your trip.</p>

        <p class="error-text" id="errorText" style="display: none"></p>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="********" />
          </div>
          <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
        </form>
      </div>

      <p class="auth-footer">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    redirectIfLoggedIn();

    const form = document.getElementById("loginForm");
    const errorText = document.getElementById("errorText");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorText.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const result = await api.login(email, password);
        setToken(result.access_token);
        window.location.href = "chat.html";
      } catch (err) {
        errorText.textContent = err.message || "Login failed";
        errorText.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
